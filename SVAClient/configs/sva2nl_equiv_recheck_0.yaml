# global 
random_seed: 0
use_cache: False
verify_only: True

# agent 
agent:
  problem:
    path: training_datasets/CodeV-SVA-dataset-83K-Qwen3p6-sva2nl-nl2sva-fixed.jsonl
    num_samples: 1
    batch_size: -1

  verification:
    path: training_datasets/CodeV-SVA-dataset-83K-Qwen3p6-sva2nl-nl2sva-fixed-self-verified.jsonl
    max_workers: 64
    batch_size: 1
    timeout: 240

# Verifier
verifier:
  host: 127.0.0.1
  port: 4422
  max_workers: 128
  queue_max_size: 1024
  memory_limit: 10
  time_limit: 180

