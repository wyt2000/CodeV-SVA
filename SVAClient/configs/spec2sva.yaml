# global 
random_seed: 0
use_cache: False 
generate_only: True

# agent 
agent:
  problem:
    path: training_datasets/case_study_back_translated.jsonl
    num_samples: 16
    batch_size: -1
    models:
      - sva : &action_model ep-20250925035746-ghz7r

  generation:
    path: training_datasets/case_study_back_translated_regenerate.jsonl
    max_workers: 8
    batch_size: 1 
    timeout: 2000000

    sva:
      use_header_as_prefix: True
      use_detailed_prompt: False
      query:
        model: *action_model
        temperature: 0
        top_p: 1.0
        max_tokens: 16384
        # stop: []
        use_system_prompt: True
        use_chat: True
        system_prompt: "You are an AI assistant tasked with formal verification of register transfer level (RTL) designs.\nYour job is to translate a description of an assertion to concrete SystemVerilog Assertion (SVA) implementation.\n"
        timeout: 2000000
  
# Verifier
verifier:
  host: 127.0.0.1
  port: 4422
  max_workers: 128
  queue_max_size: 1024
  memory_limit: 10
  time_limit: 180

# LLM server
llm_kit:
  server_type: ark_api
  url: https://ark.cn-beijing.volces.com/api/v3

