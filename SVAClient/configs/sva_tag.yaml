# global 
random_seed: 0
use_cache: True
generate_only: True

# agent 
agent:
  problem:
    path: training_datasets/all-dataset.jsonl
    num_samples: 1
    batch_size: -1
    models:
      - sva : &action_model ep-20250925035746-ghz7r

  generation:
    path: training_datasets/all-dataset-tag.jsonl
    max_workers: 256
    batch_size: 1 
    timeout: 2000000

    sva:
      use_header_as_prefix: True
      use_detailed_prompt: False
      query:
        model: *action_model
        temperature: 0
        top_p: 1.0
        max_tokens: 32768
        # stop: []
        use_system_prompt: False
        use_chat: True
        # system_prompt: "You are an AI assistant tasked with formal verification of register transfer level (RTL) designs.\nYour job is to generate a SystemVerilog assertion for the design-under-test provided.\n"
        timeout: 2000000
  
# LLM server
llm_kit:
  server_type: ark_api
  url: https://ark.cn-beijing.volces.com/api/v3
