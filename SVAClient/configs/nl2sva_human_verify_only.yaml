# global 
random_seed: 0
use_cache: False 
verify_only: True

# agent 
agent:
  problem:
    path: results/nl2sva_human_claude-sonnet-4-20250514_pass_at_k_generation.jsonl
    num_samples: 1
    batch_size: -1
    models:
      - sva : &action_model TODO
  
  verification:
    path: results/nl2sva_human_claude-sonnet-4-20250514_pass_at_k_verification.jsonl
    max_workers: 128
    batch_size: 1
    timeout: 600


# Verifier
verifier:
  host: 127.0.0.1
  port: 4422
  max_workers: 128
  queue_max_size: 1024
  memory_limit: 10
  time_limit: 180

# LLM server
llm_kit:
  server_type: openai_api
  url: https://aigc.x-see.cn/v1

