# global 
random_seed: 0
use_cache: False 

# agent 
agent:
  problem:
    path: datasets/fveval_design2sva_pipeline.jsonl
    num_samples: 5
    batch_size: -1
    models:
      - sva : &action_model TODO

  generation:
    path: TODO
    max_workers: 64
    batch_size: 1 
    timeout: 2000000

    sva:
      use_header_as_prefix: True
      use_detailed_prompt: False
      query:
        model: *action_model
        temperature: 0.8
        top_p: 0.95
        max_tokens: TODO
        # stop: []
        use_system_prompt: True
        use_chat: True
        system_prompt: "You are an AI assistant tasked with formal verification of register transfer level (RTL) designs.\nYour job is to generate a SystemVerilog assertion for the design-under-test provided.\n"
        timeout: 2000000
  
  verification:
    path: TODO
    max_workers: 32
    batch_size: 1
    timeout: 600


# Verifier
verifier:
  host: 127.0.0.1
  port: 4422
  max_workers: 128
  queue_max_size: 1024
  memory_limit: 10
  time_limit: 180

# LLM server
llm_kit:
  server_type: openai_api
  url: https://aigc.x-see.cn/v1

