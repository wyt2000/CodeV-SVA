# global 
random_seed: 0
use_cache: True
generate_only: True

# agent 
agent:
  problem:
    path: training_datasets/codev-159K-pass-at-5-Qwen-7B-checked-no-all-pass-regenerated-R1-verification-pass-0.jsonl
    num_samples: 5
    batch_size: -1
    models:
      - sva : &action_model /path/to/model

  generation:
    path: training_datasets/codev-159K-pass-at-5-Qwen-7B-checked-no-all-pass-regenerated-R1-verification-pass-0-difficulty.jsonl
    max_workers: 32
    batch_size: 1 
    timeout: 2000000

    sva:
      use_header_as_prefix: True
      use_detailed_prompt: False
      query:
        model: *action_model
        tokenizer_path: *action_model
        temperature: 0
        top_p: 1.0
        max_tokens: 16384
        # stop: []
        use_system_prompt: True
        use_chat: True
        system_prompt: "You are an AI assistant tasked with formal verification of register transfer level (RTL) designs.\nYour job is to translate a description of an assertion to concrete SystemVerilog Assertion (SVA) implementation.\n"
        timeout: 2000000
  
# vllm server
llm_kit:
  server_type: vllm 
  host: 127.0.0.1
  router_port: 2244
  router_timeout: 1000000
  api_key: ""

  models:
    - model: *action_model
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      data_parallel_size: 2
      random_seeds:
        - 42
        - 42

      vllm:
        gpu_memory_utilization: 0.8
        max_num_batched_tokens: 8192
        enable_chunked_prefill: True
        enable_prefix_caching: True
        dtype: auto
