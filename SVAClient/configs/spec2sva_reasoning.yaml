# global 
random_seed: 0
use_cache: True
generate_only: True

# agent 
agent:
  problem:
    path: training_datasets/CodeV-SVA-dataset-83K-Qwen3p6-sva2nl.jsonl
    num_samples: 1
    batch_size: -1
    models:
      - sva : &action_model qwen3.6-plus

  generation:
    path: training_datasets/CodeV-SVA-dataset-83K-Qwen3p6-sva2nl-nl2sva.jsonl
    max_workers: 512
    batch_size: 1 
    timeout: 3600

    sva:
      use_header_as_prefix: True
      use_detailed_prompt: False
      query:
        model: *action_model
        temperature: 0
        top_p: 1.0
        max_tokens: 65536
        # stop: []
        use_system_prompt: True
        use_chat: True
        system_prompt: "You are an AI assistant tasked with formal verification of register transfer level (RTL) designs.\nYour job is to translate a description of an assertion to concrete SystemVerilog Assertion (SVA) implementation.\n"
        enable_thinking: True
        timeout: 3600
  
  verification:
    path: training_datasets/CodeV-SVA-dataset-83K-Qwen3p6-sva2nl-nl2sva-self-verified.jsonl
    max_workers: 64
    batch_size: 1
    timeout: 240


# Verifier
verifier:
  host: 127.0.0.1
  port: 4422
  max_workers: 128
  queue_max_size: 1024
  memory_limit: 10
  time_limit: 180

# LLM server
llm_kit:
  server_type: openai_api
  url: https://api.example.com/v1

