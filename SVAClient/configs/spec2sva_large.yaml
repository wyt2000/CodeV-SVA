# global 
random_seed: 0
use_cache: True 
generate_only: True

# agent 
agent:
  problem:
    path: training_datasets/codev-with-testbench-seq-42K-spec-each.jsonl.2
    num_samples: 1
    batch_size: -1
    models:
      - sva : &action_model deepseek-v3.1

  generation:
    path: training_datasets/codev-with-testbench-seq-42K-spec-each-sva-generation.jsonl.2
    max_workers: 10
    batch_size: 1 
    timeout: 120

    sva:
      use_header_as_prefix: True
      use_detailed_prompt: False
      query:
        model: *action_model
        temperature: 0
        top_p: 1.0
        max_tokens: 16384
        # stop: []
        use_system_prompt: True
        use_chat: True
        system_prompt: "You are an AI assistant tasked with formal verification of register transfer level (RTL) designs.\nYour job is to translate a description of an assertion to concrete SystemVerilog Assertion (SVA) implementation.\n"
        timeout: 120
  
  verification:
    path: training_datasets/codev-with-testbench-seq-42K-spec-each-sva-verification.jsonl.1
    max_workers: 64
    batch_size: 1
    timeout: 240


# Verifier
verifier:
  host: 127.0.0.1
  port: 4422
  max_workers: 128
  queue_max_size: 1024
  memory_limit: 10
  time_limit: 180

# LLM server
llm_kit:
  server_type: openai_api
  url: https://models-proxy.stepfun-inc.com/v1

